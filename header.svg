<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f2027"><animate attributeName="stop-color" values="#0f2027;#13293d;#0f2027" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="55%" stop-color="#203a43"/>
    <stop offset="100%" stop-color="#2c5364"><animate attributeName="stop-color" values="#2c5364;#1b4d6b;#2c5364" dur="10s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="glow" x1="0" x2="1">
    <stop offset="0%" stop-color="#36bcf7" stop-opacity="0"/><stop offset="50%" stop-color="#36bcf7"/><stop offset="100%" stop-color="#36bcf7" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="r"><rect width="1200" height="300" rx="16"/></clipPath>
</defs>
<style>
  .name { font: 700 58px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #fff; letter-spacing: 1px; animation: rise 1.2s ease-out both; }
  .role { font: 500 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #36bcf7; letter-spacing: 3px; animation: rise 1.2s .3s ease-out both; }
  .tag { font: 400 22px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #e6edf3; opacity: 0; transform-box: fill-box; }
  .dot { fill: #36bcf7; opacity: .35; animation: twinkle 4s ease-in-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .6; } }
</style>
<g clip-path="url(#r)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle class="dot" cx="90" cy="60" r="2" style="animation-delay:0s"/><circle class="dot" cx="180" cy="230" r="1.5" style="animation-delay:1s"/><circle class="dot" cx="300" cy="40" r="1.5" style="animation-delay:2s"/><circle class="dot" cx="980" cy="70" r="2" style="animation-delay:0.5s"/><circle class="dot" cx="1100" cy="210" r="1.5" style="animation-delay:1.5s"/><circle class="dot" cx="860" cy="250" r="2" style="animation-delay:2.5s"/><circle class="dot" cx="520" cy="30" r="1.2" style="animation-delay:3s"/><circle class="dot" cx="700" cy="270" r="1.2" style="animation-delay:1.2s"/><circle class="dot" cx="1040" cy="130" r="1.2" style="animation-delay:2.2s"/><circle class="dot" cx="140" cy="140" r="1.2" style="animation-delay:0.8s"/>
  <path fill="#36bcf7" fill-opacity=".08" d="M0 250 Q300 210 600 250 T1200 250 V300 H0Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 250 Q300 210 600 250 T1200 250 V300 H0Z;M0 245 Q300 285 600 245 T1200 245 V300 H0Z;M0 250 Q300 210 600 250 T1200 250 V300 H0Z"/>
  </path>
  <path fill="#ffffff" fill-opacity=".05" d="M0 265 Q300 295 600 265 T1200 265 V300 H0Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 265 Q300 295 600 265 T1200 265 V300 H0Z;M0 270 Q300 240 600 270 T1200 270 V300 H0Z;M0 265 Q300 295 600 265 T1200 265 V300 H0Z"/>
  </path>
  <text class="name" x="600.0" y="118" text-anchor="middle">Hussen Mohammed</text>
  <text class="role" x="600.0" y="162" text-anchor="middle">BACKEND &amp; AI SYSTEMS ENGINEER</text>
  <rect x="440.0" y="180" width="320" height="2" fill="url(#glow)">
    <animate attributeName="width" values="0;320" dur="1.2s" begin=".6s" fill="freeze"/>
    <animate attributeName="x" values="600.0;440.0" dur="1.2s" begin=".6s" fill="freeze"/>
  </rect>
  <text class="tag t0" x="600.0" y="214" text-anchor="middle">I build backends that put LLMs to work</text><style>.t0{animation:tag0 12s infinite}@keyframes tag0{0%,0.00%{opacity:0;transform:translateY(8px)}3.00%,21.00%{opacity:1;transform:translateY(0)}24.00%,100%{opacity:0;transform:translateY(-8px)}}</style><text class="tag t1" x="600.0" y="214" text-anchor="middle">FastAPI · Celery · PostgreSQL · Redis</text><style>.t1{animation:tag1 12s infinite}@keyframes tag1{0%,24.99%{opacity:0;transform:translateY(8px)}28.00%,46.00%{opacity:1;transform:translateY(0)}49.00%,100%{opacity:0;transform:translateY(-8px)}}</style><text class="tag t2" x="600.0" y="214" text-anchor="middle">Tool-calling agents &amp; structured outputs</text><style>.t2{animation:tag2 12s infinite}@keyframes tag2{0%,49.99%{opacity:0;transform:translateY(8px)}53.00%,71.00%{opacity:1;transform:translateY(0)}74.00%,100%{opacity:0;transform:translateY(-8px)}}</style><text class="tag t3" x="600.0" y="214" text-anchor="middle">Resilient data extraction &amp; automation</text><style>.t3{animation:tag3 12s infinite}@keyframes tag3{0%,74.99%{opacity:0;transform:translateY(8px)}78.00%,96.00%{opacity:1;transform:translateY(0)}99.00%,100%{opacity:0;transform:translateY(-8px)}}</style>
</g>
</svg>