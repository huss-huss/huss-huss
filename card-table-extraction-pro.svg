  <rect x="24" y="112" width="64" height="22" rx="11" fill="#36bcf7" fill-opacity=".12"/><text class="chip" x="56" y="127" text-anchor="middle">camelot</text><rect x="96.4" y="112" width="122" height="22" rx="11" fill="#36bcf7" fill-opacity=".12"/><text class="chip" x="157" y="127" text-anchor="middle">data-extraction</text><rect x="226.4" y="112" width="93" height="22" rx="11" fill="#36bcf7" fill-opacity=".12"/><text class="chip" x="273" y="127" text-anchor="middle">document-ai</text><rect x="327.6" y="112" width="64" height="22" rx="11" fill="#36bcf7" fill-opacity=".12"/><text class="chip" x="360" y="127" text-anchor="middle">fastapi</text>
  <circle cx="30" cy="152" r="6" fill="#3572A5"/>
