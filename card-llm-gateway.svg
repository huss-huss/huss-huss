<svg xmlns="http://www.w3.org/2000/svg" width="580" height="170" viewBox="0 0 580 170">
<style>
  .c { animation: in .8s 0.0s ease-out both; }
  .t { font: 600 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #36bcf7; }
  .d { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
  .chip { font: 500 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #36bcf7; }
  .m { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
  .bar { animation: grow 1.4s 0.3s ease-out both; transform-origin: left; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
<g class="c">
  <rect x=".5" y=".5" width="579" height="169" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect class="bar" x="1" y="1" width="578" height="3" rx="1.5" fill="#3572A5"/>
  <text class="t" x="24" y="40">llm-gateway</text>
  <text class="d" x="24" y="68">Self-hosted OpenAI-compatible gateway for production LLM traffic:</text><text class="d" x="24" y="88">OpenAI, Anthropic and Ollama with fallback routing, circuit breakers…</text>
  <rect x="24" y="112" width="86" height="22" rx="11" fill="#36bcf7" fill-opacity=".12"/><text class="chip" x="67" y="127" text-anchor="middle">ai-gateway</text><rect x="118.0" y="112" width="79" height="22" rx="11" fill="#36bcf7" fill-opacity=".12"/><text class="chip" x="157" y="127" text-anchor="middle">anthropic</text><rect x="204.8" y="112" width="64" height="22" rx="11" fill="#36bcf7" fill-opacity=".12"/><text class="chip" x="237" y="127" text-anchor="middle">fastapi</text><rect x="277.20000000000005" y="112" width="36" height="22" rx="11" fill="#36bcf7" fill-opacity=".12"/><text class="chip" x="295" y="127" text-anchor="middle">llm</text>
  <circle cx="30" cy="152" r="6" fill="#3572A5"/>
  <text class="m" x="42" y="157">Python</text>
  <text class="m" x="556" y="157" text-anchor="end">★ 0</text>
</g>
</svg>